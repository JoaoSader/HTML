<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Site</title>

  <style>
    /* Fundo com listras do arco-íris do Nyan Cat */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(
        to bottom,
        #ff0000 0 16.66%,
        #ff9900 16.66% 33.33%,
        #ffff00 33.33% 50%,
        #33ff00 50% 66.66%,
        #0099ff 66.66% 83.33%,
        #6633ff 83.33% 100%
      );
    }

    #luid {
      text-align: center;
    }

    /* Título maior, com a aura atrás */
    #luid h1 {
      position: relative;
      z-index: 0;
      display: inline-block;
      margin: 0;
      padding: 20px 40px;
      font-size: 64px;
    }

    #luid a {
      color: black;
      text-decoration: none;
    }

    /* Aura do Goku (Super Saiyajin) */
    #luid h1::before {
      content: "";
      position: absolute;
      inset: -35px;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 255, 255, 0.95) 0%,
        rgba(255, 240, 80, 0.9) 30%,
        rgba(255, 190, 0, 0.7) 55%,
        rgba(255, 140, 0, 0) 75%
      );
      filter: blur(8px);
      animation: aura 0.8s ease-in-out infinite alternate;
    }

    @keyframes aura {
      from {
        transform: scale(0.95);
        opacity: 0.8;
      }
      to {
        transform: scale(1.15);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div id="luid">
    <h1><a href="https://www.instagram.com/trommer_1610/" target="_blank">Luyds</a></h1>
  </div>

</body>
</html>
